<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f0f2f5;min-height:100vh}
.top{background:#1B2A3B;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.top-t{color:#fff;font-size:15px;font-weight:700}.top-s{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px}
.live{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.7);font-size:12px}
.dot{width:7px;height:7px;background:#4CAF50;border-radius:50%;animation:pu 1.5s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.bg{background:#FEE500;color:#3C1E1E;font-size:11px;font-weight:700;padding:4px 10px;border-radius:16px;margin-left:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px 0}
.st{background:#fff;border-radius:11px;padding:12px 14px;border:.5px solid #e8eaed}
.sn{font-size:24px;font-weight:700;color:#1B2A3B}.sl{font-size:10px;color:#999;margin-top:2px}
.nf{background:#1B2A3B;color:#fff;padding:10px 16px;margin:12px 16px 0;border-radius:10px;display:none;align-items:center;gap:8px;font-size:13px}
.nf.on{display:flex}.nx{margin-left:auto;cursor:pointer;opacity:.6;font-size:16px}
.layout{display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px 16px}
.ct{font-size:10px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.bl{display:flex;flex-direction:column;gap:7px}
.bk{background:#fff;border:.5px solid #e8eaed;border-radius:11px;padding:13px 14px;cursor:pointer}
.bk.sel{border:1.5px solid #1B2A3B;background:#f5f8fc}
.bk.isnew{border-left:3px solid #FEE500}.bk.isdone{opacity:.6;border-left:3px solid #4CAF50}
.bt{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.bi{font-size:11px;color:#aaa}.bs{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px}
.bsn{background:#fff8e1;color:#e65100}.bsd{background:#e8f5e9;color:#2e7d32}
.br{font-size:14px;font-weight:700;margin-bottom:3px}.bm{font-size:11px;color:#888;display:flex;gap:6px;flex-wrap:wrap}
.emp{background:#fff;border-radius:11px;padding:40px 20px;text-align:center;color:#ccc;font-size:13px;border:.5px dashed #e0e0e0}
.sd{background:#fff;border:.5px solid #e8eaed;border-radius:12px;padding:18px;position:sticky;top:72px}
.ht{text-align:center;padding:36px 12px;color:#bbb;font-size:12px;line-height:1.7}
.dr{display:flex;justify-content:space-between;padding:7px 0;border-bottom:.5px solid #f5f5f5;font-size:12px}
.dr:last-of-type{border:none}.dk{color:#888}.dv{font-weight:600}
.mb{background:#f1f8e9;border:.5px solid #aed581;border-radius:9px;padding:11px;font-size:12px;color:#33691e;line-height:1.6;white-space:pre-wrap;word-break:break-all;margin:10px 0 12px;max-height:200px;overflow-y:auto}
.cb{width:100%;padding:14px;background:#FEE500;color:#3C1E1E;border:none;border-radius:11px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:7px}
.cb.ok{background:#4CAF50;color:#fff}
.ch{font-size:11px;color:#888;text-align:center;margin-bottom:10px}
.db{width:100%;padding:11px;background:#f5f5f5;border:.5px solid #e0e0e0;border-radius:9px;font-size:13px;font-family:inherit;cursor:pointer;color:#555}
.db.dd{background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7;cursor:default}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.sd{position:static}}
</style>
</head>
<body>
<div class="top">
  <div><div class="top-t">&#45208;&#53944;&#47734; &#53469;&#49884;&#53804;&#50612; &#8212; &#51649;&#50896; &#45824;&#49884;&#48372;&#46300;</div><div class="top-s">&#49892;&#49884;&#44036; &#50696;&#50557; &#44288;&#47532; &middot; Firebase &#50672;&#46041;</div></div>
  <div style="display:flex;align-items:center"><div class="live"><div class="dot"></div><span id="clk">--:--</span></div><div class="bg">&#51649;&#50896; &#51204;&#50857;</div></div>
</div>
<div class="stats">
  <div class="st"><div class="sn" id="sW">0</div><div class="sl">&#9203; &#45824;&#44592; &#51473;</div></div>
  <div class="st"><div class="sn" id="sD">0</div><div class="sl">&#10003; &#48176;&#52824; &#50756;&#47308;</div></div>
  <div class="st"><div class="sn" id="sT">0</div><div class="sl">&#50724;&#45212; &#52509; &#50696;&#50557;</div></div>
  <div class="st"><div class="sn" id="sR">0</div><div class="sl">&#50724;&#45212; &#47588;&#52636; (&#47564;&#8363;)</div></div>
</div>
<div class="nf" id="nf"><span style="font-size:18px">&#128661;</span><span id="nft">&#49352; &#50696;&#50557;!</span><span class="nx" onclick="this.parentElement.classList.remove('on')">&#10005;</span></div>
<div class="layout">
  <div><div class="ct">&#50724;&#45212; &#50696;&#50557; &#47785;&#47197; (&#49892;&#49884;&#44036;)</div><div class="bl" id="bl"><div class="emp">Firebase &#50672;&#44208; &#52948;&#51473;</div></div></div>
  <div><div class="ct">&#48176;&#52824; &#47700;&#49884;&#51648;</div><div class="sd" id="sd"><div class="ht">&#8592; &#50650;&#51596;&#50640;&#49436; &#50696;&#50557; &#49440;&#53469;<br>Zalo &#47700;&#49884;&#51648; &#51088;&#46041; &#49373;&#49457;</div></div></div>
</div>
<script>
var FC={apiKey:"AIzaSyAEzcyWQKvUH8FMtujWcqGNKjWx18LxswI",authDomain:"nhatrang-taxi.firebaseapp.com",projectId:"nhatrang-taxi",storageBucket:"nhatrang-taxi.firebasestorage.app",messagingSenderId:"647488499522",appId:"1:647488499522:web:a341a36256062e78a122db"};
firebase.initializeApp(FC);
var db=firebase.firestore();
var LS={cam:"\uce84\ub780 \uacf5\ud56d",city:"\ub098\ud2b8\ub791 \uc2dc\ub0b4",camranh:"\uce84\ub780 \uacf5\ud56d"};
var VN={s:"\uc18c\ud615 (4~7\uc778\uc2b9)",v:"16\uc778\uc2b9 \ubbf8\ub2c8\ubc84\uc2a4",b:"29\uc778\uc2b9 \uc911\ud615\ubc84\uc2a4",B:"45\uc778\uc2b9 \ub300\ud615\ubc84\uc2a4",small:"\uc18c\ud615 (4~7\uc778\uc2b9)",van:"16\uc778\uc2b9 \ubbf8\ub2c8\ubc84\uc2a4",bus29:"29\uc778\uc2b9 \uc911\ud615\ubc84\uc2a4",bus45:"45\uc778\uc2b9 \ub300\ud615\ubc84\uc2a4"};
var PN={g:"GLN",t:"\ud2b8\ub798\ube14\uc6d4\ub81b",c:"\ud604\uae08",gln:"GLN",tw:"\ud2b8\ub798\ube14\uc6d4\ub81b",cash:"\ud604\uae08"};
var bks=[],selId=null,isFirst=true;
function nw(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function uCk(){document.getElementById("clk").textContent=nw();}
uCk();setInterval(uCk,30000);
function gL(v){return LS[v]||v||"-";}
function gV(b){return b.vehicleName||VN[b.vehicle]||b.vehicle||"-";}
function gP(b){return PN[b.pay]||b.pay||"-";}
document.addEventListener("click",function(e){
  var bk=e.target.closest(".bk");
  if(bk){sel(bk.getAttribute("data-id"));}
  var cb=e.target.closest("#cpBtn");
  if(cb){cpMsg(selId);}
  var db2=e.target.closest(".db");
  if(db2&&!db2.classList.contains("dd")){mDone(selId);}
});
db.collection("bookings").orderBy("createdAt","desc").limit(50).onSnapshot(function(snap){
  snap.docChanges().forEach(function(c){
    if(c.type==="added"&&!isFirst){
      var b=c.doc.data();
      var el=document.getElementById("nf");
      document.getElementById("nft").textContent="\uc0c8 \uc608\uc57d! "+gL(b.from)+" \u2192 "+gL(b.to)+" \u00b7 "+(b.fare||0).toLocaleString("ko-KR")+"\u20ab";
      el.classList.add("on");
      setTimeout(function(){el.classList.remove("on");},6000);
    }
  });
  isFirst=false;
  bks=snap.docs.map(function(d){return Object.assign({docId:d.id},d.data());});
  rStats();rList();
  if(selId)rSide(selId);
},function(err){
  document.getElementById("bl").innerHTML='<div class="emp">Firebase \uc624\ub958: '+err.message+'</div>';
});
function rStats(){
  var w=0,dd=0,r=0;
  bks.forEach(function(b){
    if(b.status==="new")w++;
    else if(b.status==="dispatched"){dd++;r+=(b.fare||0);}
  });
  document.getElementById("sW").textContent=w;
  document.getElementById("sD").textContent=dd;
  document.getElementById("sT").textContent=bks.length;
  document.getElementById("sR").textContent=Math.round(r/10000);
}
function rList(){
  var el=document.getElementById("bl");
  if(!bks.length){el.innerHTML='<div class="emp">\uc608\uc57d\uc774 \uc5c6\uc2b5\ub2c8\ub2e4<br><small style="font-size:11px;margin-top:6px;display:block">\uc190\ub2d8\uc774 \uc571\uc5d0\uc11c \uc608\uc57d\ud558\uba74 \uc5ec\uae30 \ub098\ud0c0\ub0a9\ub2c8\ub2e4</small></div>';return;}
  el.innerHTML=bks.map(function(b){
    var done=b.status==="dispatched";
    var cls="bk "+(done?"isdone":"isnew")+(selId===b.id?" sel":"");
    var bs=done?'<span class="bs bsd">\u2713 \uc644\ub8cc</span>':'<span class="bs bsn">\u23f3 \ub300\uae30</span>';
    return '<div class="'+cls+'" data-id="'+(b.id||b.docId)+'">'
      +'<div class="bt"><span class="bi">'+(b.id||b.docId)+' \u00b7 '+(b.time||'')+'</span>'+bs+'</div>'
      +'<div class="br">'+gL(b.from)+' \u2192 '+gL(b.to)+'</div>'
      +'<div class="bm"><span>'+gV(b)+'</span><span>'+(b.fare||0).toLocaleString("ko-KR")+'\u20ab'+(b.night?' \ud83c\udf19':'')+'</span><span>'+gP(b)+'</span></div>'
      +'</div>';
  }).join("");
}
function sel(id){selId=id;rList();rSide(id);}
function bMsg(b){
  var eta=(b.from==="cam"||b.to==="cam"||b.from==="camranh"||b.to==="camranh")?"\uc57d 45\ubd84":"\uc57d 20\ubd84";
  return "\ud83d\ude95 [\ub098\ud2b8\ub791 \ud0dd\uc2dc\ud22c\uc5b4] \ubc30\ucc28 \uc694\uccad\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\ud83d\udccd \ucd9c\ubc1c: "+gL(b.from)+"\n\ud83c\udfc1 \ub3c4\ucc29: "+gL(b.to)+"\n\ud83d\ude8c \ucc28\ub7c9: "+gV(b)+"\n\ud83d\udcb0 \uc694\uae08: "+(b.fare||0).toLocaleString("ko-KR")+"\u20ab"+(b.night?" (\uc57c\uac04)":"")+"\n\ud83d\udcb3 \uacb0\uc81c: "+gP(b)+"\n\u23f0 \uc811\uc218: "+(b.time||"")+"\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\uc608\uc0c1 \uc18c\uc694: "+eta+"\n\uc218\ub77d \uac00\ub2a5\ud55c \uae30\uc0ac\ub2d8 \ub313\uae00 \ub0a8\uaca8\uc8fc\uc138\uc694! \ud83d\udc47";
}
function rSide(id){
  var b=bks.find(function(x){return x.id===id||x.docId===id;});
  if(!b)return;
  var done=b.status==="dispatched",msg=bMsg(b);
  document.getElementById("sd").innerHTML='<div class="ct" style="margin-bottom:8px">\uc608\uc57d \uc0c1\uc138</div>'
    +'<div class="dr"><span class="dk">\uc608\uc57d\ubc88\ud638</span><span class="dv">'+(b.id||b.docId)+'</span></div>'
    +'<div class="dr"><span class="dk">\ucd9c\ubc1c</span><span class="dv">'+gL(b.from)+'</span></div>'
    +'<div class="dr"><span class="dk">\ub3c4\ucc29</span><span class="dv">'+gL(b.to)+'</span></div>'
    +'<div class="dr"><span class="dk">\ucc28\ub7c9</span><span class="dv">'+gV(b)+'</span></div>'
    +'<div class="dr"><span class="dk">\uc694\uae08</span><span class="dv">'+(b.fare||0).toLocaleString("ko-KR")+'\u20ab'+(b.night?' (\uc57c\uac04)':'')+'</span></div>'
    +'<div class="dr"><span class="dk">\uacb0\uc81c</span><span class="dv">'+gP(b)+'</span></div>'
    +'<div class="dr"><span class="dk">\uc811\uc218</span><span class="dv">'+(b.time||'')+'</span></div>'
    +'<div style="font-size:10px;font-weight:700;color:#999;margin:12px 0 0;text-transform:uppercase">Zalo \uba54\uc2dc\uc9c0</div>'
    +'<div class="mb" id="msgBox">'+msg+'</div>'
    +'<button class="cb" id="cpBtn">&#128203; \uba54\uc2dc\uc9c0 \ubcf5\uc0ac</button>'
    +'<div class="ch" id="cpHint">\ubcf5\uc0ac \ud6c4 Zalo \uae30\uc0ac \ub2e8\uccb4\ubc29\uc5d0 \ubd99\uc5ec\ub123\uae30</div>'
    +'<button class="db'+(done?' dd':'')+'">'+(done?'\u2705 \ubc30\ucc28 \uc644\ub8cc\ub428':'\ubc30\ucc28 \uc644\ub8cc\ub85c \ud45c\uc2dc')+'</button>';
}
function cpMsg(id){
  var b=bks.find(function(x){return x.id===id||x.docId===id;});
  if(!b)return;
  var msg=bMsg(b);
  if(navigator.clipboard){navigator.clipboard.writeText(msg);}
  else{var t=document.createElement("textarea");t.value=msg;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();document.execCommand("copy");document.body.removeChild(t);}
  var btn=document.getElementById("cpBtn"),hint=document.getElementById("cpHint");
  if(!btn)return;
  btn.classList.add("ok");btn.innerHTML="\u2705 \ubcf5\uc0ac \uc644\ub8cc!";
  hint.textContent="\u2713 \ud074\ub9bd\ubcf4\ub4dc \uc800\uc7a5\ub428. Zalo \uc5f4\uc5b4 \ubd99\uc5ec\ub123\uae30";hint.style.color="#2e7d32";
  setTimeout(function(){btn.classList.remove("ok");btn.innerHTML="&#128203; \uba54\uc2dc\uc9c0 \ubcf5\uc0ac";hint.textContent="\ubcf5\uc0ac \ud6c4 Zalo \uae30\uc0ac \ub2e8\uccb4\ubc29\uc5d0 \ubd99\uc5ec\ub123\uae30";hint.style.color="#888";},4000);
}
function mDone(id){
  if(!id)return;
  var b=bks.find(function(x){return x.id===id||x.docId===id;});
  if(!b||b.status==="dispatched")return;
  db.collection("bookings").doc(b.docId||id).update({status:"dispatched"}).catch(function(e){console.error(e);});
}
</script>
</body>
